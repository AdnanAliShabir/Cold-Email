<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <title>LeadCRM Store Extractor</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <h1>LeadCRM</h1>
        <p class="sub">Store → CRM</p>
      </div>
      <div class="top-actions">
        <span id="platformBadge" class="badge hidden"></span>
        <button id="themeToggle" type="button" class="theme-btn" title="Toggle light / dark" aria-label="Toggle theme">
          <span id="themeIcon">☾</span>
        </button>
      </div>
    </header>

    <details id="apiDetails" class="panel">
      <summary>API settings</summary>
      <label class="field">Base URL
        <input id="apiBase" type="url" placeholder="https://…onrender.com/api" autocomplete="off" />
      </label>
    </details>

    <section id="authLoggedOut" class="panel auth">
      <div class="grid-2">
        <label class="field">Email
          <input id="loginEmail" type="email" placeholder="admin@crm.com" autocomplete="username" />
        </label>
        <label class="field">Password
          <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password" />
        </label>
      </div>
      <button id="loginBtn" class="btn btn-primary">Sign in</button>
    </section>

    <section id="authLoggedIn" class="auth-bar hidden">
      <span id="authUser" class="auth-user"></span>
      <button id="logoutBtn" type="button" class="linkish">Sign out</button>
    </section>

    <p class="status" id="status"></p>

    <div id="emptyState" class="empty hidden">
      Open a Play / App Store <strong>app details</strong> page, then Re-extract.
    </div>

    <section id="form" class="hidden">
      <div class="app-card">
        <img id="appIcon" alt="" />
        <div class="app-card-body">
          <strong id="appName"></strong>
          <span id="appMeta" class="meta"></span>
          <span id="fSourceHint" class="meta soft"></span>
        </div>
      </div>

      <div class="stats" id="statsRow">
        <div class="stat"><em id="statRating">—</em><span>Rating</span></div>
        <div class="stat"><em id="statReviews">—</em><span>Reviews</span></div>
        <div class="stat"><em id="statDownloads">—</em><span>Downloads</span></div>
        <div class="stat"><em id="statVersion">—</em><span>Version</span></div>
      </div>

      <div class="grid-2">
        <label class="field">App
          <input id="fName" />
        </label>
        <label class="field">Company
          <input id="fCompany" />
        </label>
      </div>
      <label class="field">Website
        <input id="fWebsite" placeholder="https://..." />
      </label>
      <label class="field">Store URL
        <input id="fUrl" />
      </label>

      <div class="grid-3">
        <label class="field">Rating
          <input id="fRating" type="number" step="0.1" min="0" max="5" />
        </label>
        <label class="field">Reviews
          <input id="fReviews" type="number" />
        </label>
        <label class="field">Downloads
          <input id="fDownloads" type="number" />
        </label>
      </div>
      <div class="grid-3">
        <label class="field">Version
          <input id="fVersion" />
        </label>
        <label class="field">Updated
          <input id="fUpdated" />
        </label>
        <label class="field">Released
          <input id="fReleased" readonly />
        </label>
      </div>
      <div class="grid-2">
        <label class="field">Requires
          <input id="fRequires" readonly />
        </label>
        <label class="field">Size
          <input id="fSize" readonly />
        </label>
      </div>

      <div class="grid-2">
        <label class="field">Contact
          <input id="fContact" placeholder="Name" />
        </label>
        <label class="field">Email
          <input id="fEmail" placeholder="email@" />
        </label>
      </div>
      <div class="grid-2">
        <label class="field">Country
          <input id="fCountry" />
        </label>
        <label class="field">Phone
          <input id="fPhone" placeholder="(optional)" />
        </label>
      </div>
      <label class="field">Address
        <input id="fAddress" />
      </label>
      <div class="grid-2">
        <label class="field">Source
          <select id="fSource">
            <option>Play Store Search</option>
            <option>App Store Search</option>
            <option>Website Discovery</option>
            <option>LinkedIn</option>
            <option>Cold Email</option>
            <option>Chrome Extension</option>
          </select>
        </label>
        <label class="field">Priority
          <select id="fPriority">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
        </label>
      </div>

      <div id="liActions" class="actions-row hidden">
        <button id="openLiPeople" type="button" class="btn btn-ghost">LinkedIn people</button>
        <button id="openLiCompany" type="button" class="btn btn-ghost">LinkedIn company</button>
      </div>

      <div class="actions-row">
        <button id="reextract" class="btn btn-ghost">Re-extract</button>
        <button id="sendToCrm" class="btn btn-primary">Send to CRM</button>
      </div>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
